[package]
name = "dbr"
version = "11.6.60"
edition = "2021"
description = "Dynamsoft Barcode Reader SDK wrapper: read QR Code, DataMatrix, PDF417, Code 128 and more from images, PDFs and raw pixel buffers"
license = "MIT"
repository = "https://github.com/yushulx/cmake-cpp-barcode-qrcode-mrz"
homepage = "https://www.dynamsoft.com/capture-vision/docs/core/introduction/"
documentation = "https://docs.rs/dbr"
keywords = ["barcode", "qrcode", "pdf417", "datamatrix", "decoder"]
categories = ["multimedia::images", "api-bindings"]
readme = "README.md"
links = "dbr"
# include/ and lib/ are gitignored and staged by scripts/stage-sdk.sh right
# before publishing, so the file list has to be spelled out: an explicit
# `include` is the only way to package files that git ignores.
include = [
    "Cargo.toml",
    "build.rs",
    "LICENSE",
    "README.md",
    "src/**",
    "native/**",
    "examples/**",
    "tests/**",
    "include/**",
    "lib/**",
]

[dependencies]

[dev-dependencies]
image = "0.24"

[build-dependencies]
cc = "1.0"
ureq = "2.9"
zip = "0.6"
sha2 = "0.10"