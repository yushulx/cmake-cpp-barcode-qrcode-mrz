name: CMake

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x64
            generator: Unix Makefiles
            configure_args: ""
            runtime_dir: ""
            executable: main
          - os: windows-latest
            name: Windows x64
            generator: Visual Studio 17 2022
            configure_args: "-A x64"
            runtime_dir: /Release
            executable: main.exe
          - os: macos-latest
            name: macOS arm64
            generator: Unix Makefiles
            configure_args: ""
            runtime_dir: ""
            executable: main

    steps:
    - uses: actions/checkout@v4

    - name: Show toolchain
      shell: bash
      run: |
        cmake --version
        echo "CPU: $(uname -m)"

    - name: Configure command line example
      shell: bash
      run: >
        cmake -S "${{ github.workspace }}/examples/command-line"
        -B "${{ github.workspace }}/build/command-line"
        -G "${{ matrix.generator }}" ${{ matrix.configure_args }}
        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

    - name: Build command line example
      shell: bash
      run: cmake --build "${{ github.workspace }}/build/command-line" --config ${{ env.BUILD_TYPE }} --parallel

    - name: Run command line example
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        BIN="build/command-line${{ matrix.runtime_dir }}/${{ matrix.executable }}"
        echo "Running $BIN"
        "$BIN" images/AllSupportedBarcodeTypes.png | tee command-line-output.txt
        # The sample image contains 18 barcodes; a loaded SDK decodes them all.
        grep -q "Decoded 1[0-9] barcodes" command-line-output.txt

    - name: Configure tests
      shell: bash
      run: >
        cmake -S "${{ github.workspace }}/tests"
        -B "${{ github.workspace }}/build/tests"
        -G "${{ matrix.generator }}" ${{ matrix.configure_args }}
        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

    - name: Build tests
      shell: bash
      run: cmake --build "${{ github.workspace }}/build/tests" --config ${{ env.BUILD_TYPE }} --parallel

    - name: Run tests
      shell: bash
      env:
        # Optional: override the bundled demo license with a repository secret.
        DYNAMSOFT_LICENSE_KEY: ${{ secrets.DYNAMSOFT_LICENSE_KEY }}
      run: ctest --test-dir "${{ github.workspace }}/build/tests" -C ${{ env.BUILD_TYPE }} --output-on-failure

    - name: Upload test logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs-${{ matrix.os }}
        path: |
          command-line-output.txt
          build/tests/Testing/Temporary/LastTest.log
        if-no-files-found: ignore
