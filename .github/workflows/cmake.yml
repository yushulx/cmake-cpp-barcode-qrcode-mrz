name: CMake

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x64
            executable: main
          - os: windows-latest
            name: Windows x64
            executable: main.exe
          - os: macos-latest
            name: macOS arm64
            executable: main

    steps:
    - uses: actions/checkout@v4

    # windows-latest no longer ships the "Visual Studio 17 2022" generator in
    # every image, so use Ninja everywhere and let this action put cl.exe on
    # PATH for the MSVC build.
    - name: Set up MSVC (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Ensure Ninja (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
          choco install ninja -y --no-progress
        }
        ninja --version

    - name: Show toolchain
      shell: bash
      run: |
        cmake --version
        ninja --version
        echo "CPU: $(uname -m)"

    - name: Configure command line example
      shell: bash
      run: >
        cmake -S "${{ github.workspace }}/examples/command-line"
        -B "${{ github.workspace }}/build/command-line"
        -G Ninja
        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

    - name: Build command line example
      shell: bash
      run: cmake --build "${{ github.workspace }}/build/command-line" --parallel

    - name: Run command line example
      shell: bash
      run: |
        # Templates/ and Models/ are copied next to the executable, and the
        # sample resolves them relative to the working directory.
        BIN_DIR="${{ github.workspace }}/build/command-line"
        cd "$BIN_DIR"
        ./${{ matrix.executable }} "${{ github.workspace }}/images/AllSupportedBarcodeTypes.png" | tee "${{ github.workspace }}/command-line-output.txt"
        # The sample image contains 18 barcodes; a loaded SDK decodes them all.
        grep -q "Decoded 1[0-9] barcodes" "${{ github.workspace }}/command-line-output.txt"

    - name: Configure tests
      shell: bash
      run: >
        cmake -S "${{ github.workspace }}/tests"
        -B "${{ github.workspace }}/build/tests"
        -G Ninja
        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

    - name: Build tests
      shell: bash
      run: cmake --build "${{ github.workspace }}/build/tests" --parallel

    - name: Run tests
      shell: bash
      env:
        # Optional: override the bundled demo license with a repository secret.
        DYNAMSOFT_LICENSE_KEY: ${{ secrets.DYNAMSOFT_LICENSE_KEY }}
      run: ctest --test-dir "${{ github.workspace }}/build/tests" --output-on-failure

    - name: Upload test logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs-${{ matrix.os }}
        path: |
          command-line-output.txt
          build/tests/Testing/Temporary/LastTest.log
        if-no-files-found: ignore
